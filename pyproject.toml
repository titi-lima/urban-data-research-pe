[project]
name = "urban-data-research-pe"
version = "0.1.0"
description = "Archived reproducible urban-data POCs for Cabo and the Recife metro area"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
urban-research = "urban_vulnerability.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_vulnerability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["FLY002"]
